# Librarian — firm-wide index, rebuilt once per merge.
#
# Copy to .github/workflows/librarian-index.yml in each repository you want indexed.
# Every merge to the default branch re-indexes ONLY the files that changed, learns
# "task -> files" from the merged commit message, and commits the shared index to
# .trishAI/shared/. Developers get the index on their next pull at zero AI cost.
#
# Requirements
#   - GitHub Models enabled for your organisation (uses the workflow's own GITHUB_TOKEN),
#     or switch the provider below to `openai` (Azure OpenAI / internal gateway) or `anthropic`.
#   - If the Librarian repo is private, add a secret LIBRARIAN_TOOL_TOKEN with read access to it.
#   - If the default branch is protected, allow this workflow to push (ruleset bypass for
#     GitHub Actions, or a GitHub App token) — see docs/CI.md.

name: Librarian index

on:
  push:
    branches: [main]
    paths-ignore:
      - '.trishAI/**'
  workflow_dispatch:
    inputs:
      full:
        description: 'Re-scan every file (still skips unchanged ones)'
        type: boolean
        default: false

concurrency:
  group: librarian-index-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # commit the shared index
  models: read      # GitHub Models for summaries

env:
  LIBRARIAN_REPO: ahemed-haneen/LibrarianAI
  LIBRARIAN_REF: main
  PROVIDER: github-models          # github-models | openai | anthropic | none
  MODEL: openai/gpt-4.1-mini       # a small, cheap model is plenty for file summaries

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Librarian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LIBRARIAN_REPO }}
          ref: ${{ env.LIBRARIAN_REF }}
          path: .librarian-tool
          token: ${{ secrets.LIBRARIAN_TOOL_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Librarian CLI
        working-directory: .librarian-tool
        run: pnpm install --frozen-lockfile && node esbuild.js --production

      - name: Index changed files
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # For PROVIDER=openai:     LIBRARIAN_API_KEY + LIBRARIAN_BASE_URL
          # For PROVIDER=anthropic:  ANTHROPIC_API_KEY
          LIBRARIAN_API_KEY: ${{ secrets.LIBRARIAN_API_KEY }}
          LIBRARIAN_BASE_URL: ${{ vars.LIBRARIAN_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SINCE=""
          if [ "${{ inputs.full }}" != "true" ] && [ -n "${{ github.event.before }}" ]; then
            SINCE="--changed-since ${{ github.event.before }}"
          fi
          node .librarian-tool/dist/cli.js index --layer shared $SINCE \
            --provider "$PROVIDER" --model "$MODEL" --concurrency 3

      - name: Learn from merged commits
        run: |
          if [ -n "${{ github.event.before }}" ] && ! echo "${{ github.event.before }}" | grep -qE '^0+$'; then
            node .librarian-tool/dist/cli.js learn --layer shared --range "${{ github.event.before }}..${{ github.sha }}" || true
          else
            node .librarian-tool/dist/cli.js learn --layer shared --last 1 || true
          fi
          node .librarian-tool/dist/cli.js status

      - name: Commit shared index
        run: |
          rm -rf .librarian-tool
          git add .trishAI/shared .trishAI/.gitignore
          if git diff --cached --quiet; then
            echo "Index already up to date."
            exit 0
          fi
          git config user.name "librarian-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(librarian): update shared index [skip ci]"
          # Another merge may have landed while we were indexing; the next run indexes it.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref }}"
